[workspace]
resolver = "2"
members = ["crates/sense-schema", "crates/sense-core", "crates/sensed", "crates/sense-cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
