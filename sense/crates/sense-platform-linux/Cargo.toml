[package]
name = "sense-platform-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "In-process Sense sources for Linux. Everything Linux-specific that is not an extension."

[target.'cfg(target_os = "linux")'.dependencies]
sense-schema = { path = "../sense-schema" }
sense-core = { path = "../sense-core" }
