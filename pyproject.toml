[project]
name = "bloom"
version = "0.0.1"
description = "Un raccourci, un menu en cercle, la bonne action."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright[nodejs]>=1.1.380",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bloom"]

# ── Tests ──
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

# ── Lint et format ──
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "lab"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
# Règles désactivées volontairement : la raison de chacune est dans docs/evidence/tech-debt.md (O2).
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# ── Types : strict pour le corps, standard pour les blocs ──
[tool.pyright]
include = ["src", "tests", "lab"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src/bloom/core"]
venvPath = "."
venv = ".venv"

# ── Règles d'architecture, vérifiées par `make check` (lint-imports) ──
[tool.importlinter]
root_package = "bloom"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Les 4 blocs ne s'importent jamais entre eux"
type = "independence"
modules = ["bloom.decision", "bloom.context", "bloom.surface", "bloom.interface"]

[[tool.importlinter.contracts]]
name = "Le corps ne dépend d'aucun bloc (seul bloom.app les branche)"
type = "forbidden"
source_modules = ["bloom.core"]
forbidden_modules = ["bloom.decision", "bloom.context", "bloom.surface", "bloom.interface", "bloom.app"]

[[tool.importlinter.contracts]]
name = "Un bloc n'utilise du corps que contracts et policy"
type = "forbidden"
source_modules = ["bloom.decision", "bloom.context", "bloom.surface", "bloom.interface"]
forbidden_modules = ["bloom.core.pipeline", "bloom.core.audit", "bloom.app"]

[[tool.importlinter.contracts]]
name = "Le corps et le contexte n'appellent jamais le réseau ni un SDK de modèle"
type = "forbidden"
source_modules = ["bloom.core", "bloom.context"]
forbidden_modules = ["httpx", "requests", "aiohttp", "openai", "anthropic"]
