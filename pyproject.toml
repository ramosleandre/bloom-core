[project]
name = "bloom"
version = "0.0.1"
description = "One hotkey, a pie menu, the right action."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright[nodejs]>=1.1.380",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bloom"]

# ── Tests ──
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

# ── Lint and format ──
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "lab"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]

# Rules disabled on purpose: the reason for each one is in docs/evidence/tech-debt.md (O2).
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# ── Types: strict for the core, standard for the blocks ──
[tool.pyright]
include = ["src", "tests", "lab"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src/bloom/core"]
venvPath = "."
venv = ".venv"

# ── Architecture rules, checked by `make check` (lint-imports) ──
[tool.importlinter]
root_package = "bloom"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The 4 blocks never import each other"
type = "independence"
modules = ["bloom.decision", "bloom.context", "bloom.surface", "bloom.interface"]

[[tool.importlinter.contracts]]
name = "The core depends on no block (only bloom.app wires them)"
type = "forbidden"
source_modules = ["bloom.core"]
forbidden_modules = ["bloom.decision", "bloom.context", "bloom.surface", "bloom.interface", "bloom.app"]

[[tool.importlinter.contracts]]
name = "A block only uses contracts and policy from the core"
type = "forbidden"
source_modules = ["bloom.decision", "bloom.context", "bloom.surface", "bloom.interface"]
forbidden_modules = ["bloom.core.pipeline", "bloom.core.audit", "bloom.app"]

[[tool.importlinter.contracts]]
name = "The core and the context never call the network or a model SDK"
type = "forbidden"
source_modules = ["bloom.core", "bloom.context"]
forbidden_modules = ["httpx", "requests", "aiohttp", "openai", "anthropic"]
